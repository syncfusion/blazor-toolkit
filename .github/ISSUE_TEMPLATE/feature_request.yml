name: 💡 Feature request
description: Suggest a new component, enhancement, or API.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape the toolkit! Feature requests drive our [roadmap](https://github.com/syncfusion/blazor-toolkit/blob/main/ROADMAP.md) — the more detail and 👍 reactions, the higher it rises.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched [existing issues](https://github.com/syncfusion/blazor-toolkit/issues) and this hasn't been requested.
          required: true
        - label: I checked the [ROADMAP](https://github.com/syncfusion/blazor-toolkit/blob/main/ROADMAP.md) and it isn't already planned.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What component, API, or behavior would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other libraries, workarounds, or approaches you've tried.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, or examples from other libraries.
