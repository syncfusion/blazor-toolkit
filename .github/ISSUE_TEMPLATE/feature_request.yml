name: 💡 Feature request
description: Suggest a new component, enhancement, or API.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape the toolkit! It is Chart-first and does not currently include a Grid. New component proposals and use cases for planned work are welcome. Check the [roadmap](https://github.com/syncfusion/blazor-toolkit/blob/main/ROADMAP.md) and contribute to an existing issue where possible. Reactions indicate interest but do not automatically set priority or promise a delivery date.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched [existing issues](https://github.com/syncfusion/blazor-toolkit/issues) and will link related requests or explain the distinct use case.
          required: true
        - label: I checked the [ROADMAP](https://github.com/syncfusion/blazor-toolkit/blob/main/ROADMAP.md) and will note related plans if applicable.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What component, API, or behavior would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other libraries, workarounds, or approaches you've tried.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Related issues or roadmap entries, mockups, and public examples. Do not include credentials, personal data, or confidential material.
