name: 🐛 Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections below so we can reproduce and fix it quickly.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched [existing issues](https://github.com/syncfusion/blazor-toolkit/issues) and this has not been reported.
          required: true
        - label: I am using a supported .NET version (8, 9, or 10).
          required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Which component is involved? e.g. SfChart, SfDatePicker, SfTextBox.
      placeholder: SfDatePicker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a code snippet / repo link that reproduces the issue.
      placeholder: |
        1. Add `<SfDatePicker ... />`
        2. Set Min/Max to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: dotnet
    attributes:
      label: .NET version
      options:
        - ".NET 8"
        - ".NET 9"
        - ".NET 10"
    validations:
      required: true
  - type: dropdown
    id: render-mode
    attributes:
      label: Blazor render mode
      options:
        - Server (Interactive Server)
        - WebAssembly (Interactive WebAssembly)
        - Auto
        - Static SSR
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Toolkit package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment (OS, browser)
      placeholder: "macOS 15, Chrome 130"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
