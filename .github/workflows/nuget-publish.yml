name: Publish NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Run gulp themes task
        run: npx gulp blazor-toolkit-themes

      - name: Set version from git tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION"

      - name: Write strong-name key
        run: echo "${{ secrets.STRONG_NAME_KEY_BASE64 }}" | base64 --decode > src/sf.snk

      - name: Restore
        run: dotnet restore src/Syncfusion.Blazor.Toolkit.csproj -p:ContinuousIntegrationBuild=true

      - name: Dependency vulnerability scan
        run: |
          set -euo pipefail
          set +e
          dotnet list src/Syncfusion.Blazor.Toolkit.csproj package --vulnerable --include-transitive \
            --format json > vuln-report.json
          vuln_exit=$?
          dotnet list src/Syncfusion.Blazor.Toolkit.csproj package --vulnerable --include-transitive \
            > vuln-report.txt 2>&1 || true
          set -e

          if [ "$vuln_exit" -ne 0 ]; then
            echo "::error::Vulnerable packages detected — release blocked."
            echo "::group::Vulnerability scan output"
            cat vuln-report.txt
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-report
          path: |
            vuln-report.json
            vuln-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: |
          dotnet build src/Syncfusion.Blazor.Toolkit.csproj \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:Version=$VERSION

      - name: Pack
        run: |
          dotnet pack src/Syncfusion.Blazor.Toolkit.csproj \
            -c Release \
            --no-build \
            -o nupkg \
            -p:ContinuousIntegrationBuild=true \
            -p:Version=$VERSION

      - name: Remove strong-name key
        if: always()
        run: rm -f src/sf.snk

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          provenance-repository-refs: ${{ github.ref }}

      - name: Install NuGetKeyVaultSignTool
        run: dotnet tool install --global NuGetKeyVaultSignTool

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign NuGet packages
        run: |
          NuGetKeyVaultSignTool sign nupkg/*.nupkg \
            --file-digest sha256 \
            --timestamp-rfc3161 http://timestamp.digicert.com \
            --timestamp-digest sha256 \
            --azure-key-vault-url "${{ vars.AZURE_KEY_VAULT_URL }}" \
            --azure-key-vault-certificate "${{ vars.AZURE_KEY_VAULT_CERT_NAME }}"

      - name: Push to NuGet.org
        run: |
          NUGET_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nuget.org" | jq -r '.value')
          echo "::add-mask::$NUGET_TOKEN"
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_TOKEN" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate