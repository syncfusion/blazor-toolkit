name: Publish NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Run gulp themes task
        run: npx gulp blazor-toolkit-themes

      - name: Write strong-name key
        run: echo "${{ secrets.STRONG_NAME_KEY_BASE64 }}" | base64 --decode > src/sf.snk

      - name: Restore
        run: dotnet restore src/Syncfusion.Blazor.Toolkit.csproj -p:ContinuousIntegrationBuild=true

      - name: Dependency vulnerability scan
        run: |
          set -euo pipefail
          # Capture both formats. Exit non-zero captures the actual gate. Captures, gate, output.
          set +e
          dotnet list src/Syncfusion.Blazor.Toolkit.csproj package --vulnerable --include-transitive \
            --format json > vuln-report.json
          vuln_exit=$?
          dotnet list src/Syncfusion.Blazor.Toolkit.csproj package --vulnerable --include-transitive \
            > vuln-report.txt 2>&1 || true
          set -e

          if [ "$vuln_exit" -ne 0 ]; then
            echo "::error::Vulnerable packages detected — release blocked. See 'vuln-report' artifact for details."
            echo "::group::Vulnerability scan output"
            cat vuln-report.txt
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-report
          path: |
            vuln-report.json
            vuln-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Resolve next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NUGET_PKG="Syncfusion.Blazor.Toolkit"
          REPO="${GITHUB_REPOSITORY}"

          # --- 1. Latest version on nuget.org (flat-container). ---
          # flat-container returns absolute URLs to each version's .nupkg; we only need the
          # list itself to compute the floor. A non-fatal warning is emitted if the lookup
          # fails (e.g. transient CDN issue) so a stale GitHub-only floor still keeps the
          # release moving.
          nuget_latest="0.0.0"
          if nuget_response=$(curl -fsS "https://api.nuget.org/v3-flatcontainer/${NUGET_PKG}/index.json" 2>/dev/null); then
            nuget_latest=$(echo "$nuget_response" \
              | jq -r '.versions[]?' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1) || true
            nuget_latest="${nuget_latest:-0.0.0}"
          else
            echo "::warning::Could not query nuget.org for latest version of ${NUGET_PKG} — falling back to '0.0.0'."
          fi

          # --- 2. Latest GitHub release tag for this repo. ---
          # Fetched via the GitHub REST API. Drafts and prereleases are filtered out so a
          # `v1.1.0-rc.1` tag never blocks a `v1.0.x` maintenance bump. Authenticated via
          # the workflow's built-in GITHUB_TOKEN to lift the 60-req/hr anonymous rate limit.
          releases_latest="0.0.0"
          if releases_response=$(curl -fsS \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/releases?per_page=20" 2>/dev/null); then
            releases_latest=$(echo "$releases_response" \
              | jq -r '.[]? | select(.draft == false and .prerelease == false) | .tag_name' \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1) || true
            releases_latest="${releases_latest:-0.0.0}"
          else
            echo "::warning::Could not query GitHub releases for ${REPO} — falling back to '0.0.0'."
          fi

          # --- 3. Pick the highest of the two floors. ---
          # `sort -V` gives correct numeric ordering; `tail -n 1` picks the max.
          floor=$(printf '%s\n%s\n' "${nuget_latest}" "${releases_latest}" | sort -V | tail -n 1)
          floor="${floor:-0.0.0}"

          # --- 4. Bump the patch component by 1. ---
          # If both lookups returned 0.0.0 the result is 0.0.1 — safe because nuget.org
          # would have rejected a republish under the hardcoded "1.0.0" anyway.
          IFS='.' read -r f_major f_minor f_patch <<< "${floor}"
          next_major="${f_major:-0}"
          next_minor="${f_minor:-0}"
          next_patch="$((${f_patch:-0} + 1))"
          next_version="${next_major}.${next_minor}.${next_patch}"

          echo "nuget_latest    = ${nuget_latest}"
          echo "releases_latest = ${releases_latest}"
          echo "floor           = ${floor}"
          echo "next_version    = ${next_version}"
          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build src/Syncfusion.Blazor.Toolkit.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:PackageVersion=${{ steps.version.outputs.next_version }}

      - name: Pack
        run: dotnet pack src/Syncfusion.Blazor.Toolkit.csproj -c Release --no-build -o nupkg -p:ContinuousIntegrationBuild=true -p:PackageVersion=${{ steps.version.outputs.next_version }}

      - name: Remove strong-name key
        if: always()
        run: rm -f src/sf.snk

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          provenance-repository-refs: ${{ github.ref }}

      - name: Install NuGetKeyVaultSignTool
        run: dotnet tool install --global NuGetKeyVaultSignTool

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign NuGet packages
        run: |
          NuGetKeyVaultSignTool sign nupkg/*.nupkg \
            --file-digest sha256 \
            --timestamp-rfc3161 http://timestamp.digicert.com \
            --timestamp-digest sha256 \
            --azure-key-vault-url "${{ vars.AZURE_KEY_VAULT_URL }}" \
            --azure-key-vault-certificate "${{ vars.AZURE_KEY_VAULT_CERT_NAME }}"

      - name: Push to NuGet.org
        run: |
          NUGET_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nuget.org" | jq -r '.value')
          echo "::add-mask::$NUGET_TOKEN"
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_TOKEN" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
