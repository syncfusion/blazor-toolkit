name: Publish NuGet

# Triggered by version tags: v1.0.0, v1.2.3-preview, etc.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for both NuGet OIDC trusted publishing and Azure Workload Identity

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for SourceLink commit SHA

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      # Decode the strong-name key stored as a base64 GitHub Secret.
      # To create the secret: certutil -encode sf.snk sf.snk.b64  (or base64 sf.snk)
      - name: Write strong-name key
        run: echo "${{ secrets.STRONG_NAME_KEY_BASE64 }}" | base64 --decode > src/sf.snk

      - name: Restore
        run: dotnet restore src/Syncfusion.Blazor.Toolkit.csproj

      # Fail the release if any direct or transitive dependency has a known CVE.
      - name: Dependency vulnerability scan
        run: |
          dotnet list src/Syncfusion.Blazor.Toolkit.csproj package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable packages detected — release blocked. See vuln-report.txt for details."
            exit 1
          fi

      - name: Build
        run: dotnet build src/Syncfusion.Blazor.Toolkit.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack src/Syncfusion.Blazor.Toolkit.csproj -c Release --no-build -o nupkg

      - name: Remove strong-name key
        if: always()
        run: rm -f src/sf.snk

      - name: Install NuGetKeyVaultSignTool
        run: dotnet tool install --global NuGetKeyVaultSignTool

      # Log in to Azure using Workload Identity Federation — no client secret needed.
      # Prerequisite: add a federated credential for this repo+workflow on the service principal in Azure.
      # Non-secret config values (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_KEY_VAULT_URL,
      # AZURE_KEY_VAULT_CERT_NAME) are stored as GitHub Actions repository *variables* (vars.*), not secrets.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # DefaultAzureCredential picks up the ambient Workload Identity token set by azure/login above.
      - name: Sign NuGet packages
        run: |
          NuGetKeyVaultSignTool sign nupkg/*.nupkg \
            --file-digest sha256 \
            --timestamp-rfc3161 http://timestamp.digicert.com \
            --timestamp-digest sha256 \
            --azure-key-vault-url "${{ vars.AZURE_KEY_VAULT_URL }}" \
            --azure-key-vault-certificate "${{ vars.AZURE_KEY_VAULT_CERT_NAME }}"

      # Exchange the GitHub OIDC token for a short-lived NuGet.org API token (trusted publishing).
      # Prerequisite: configure a trusted publisher on nuget.org for this repo + workflow file.
      - name: Push to NuGet.org
        run: |
          NUGET_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nuget.org" | jq -r '.value')
          echo "::add-mask::$NUGET_TOKEN"
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_TOKEN" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
