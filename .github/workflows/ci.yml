name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # =========================================================
  # Job 1: Build + bUnit (matrix across .NET versions)
  # =========================================================
  bunit:
    name: bUnit (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # ---------- Caching (best practices) ----------
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.dotnet-version }}-${{ hashFiles('**/*.*proj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.dotnet-version }}-
            nuget-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Restore
        run: dotnet restore ./Syncfusion.Blazor.Toolkit.slnx

      - name: Build
        run: dotnet build ./Syncfusion.Blazor.Toolkit.slnx -c Release --no-restore

      - name: Run bUnit tests
        run: |
          mkdir -p TestResults
          dotnet test tests/Syncfusion.Blazor.Toolkit.BUnitTest/ \
            -c Release \
            --no-build \
            --logger "trx;LogFileName=bunit-${{ matrix.dotnet-version }}.trx" \
            --logger "html;LogFileName=bunit-${{ matrix.dotnet-version }}.html" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage" \
            --verbosity normal

      - name: Upload bUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunit-results-${{ matrix.dotnet-version }}
          path: |
            TestResults/
            **/coverage.cobertura.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish bUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: bUnit (.NET ${{ matrix.dotnet-version }})
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

  # =========================================================
  # Job 2: Playwright (runs in parallel)
  # =========================================================
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.*proj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      # Playwright browser cache (best practice)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (when cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore
        run: dotnet restore ./Syncfusion.Blazor.Toolkit.slnx

      - name: Build
        run: dotnet build ./Syncfusion.Blazor.Toolkit.slnx -c Release --no-restore

      - name: Run Playwright tests (with coverage)
        run: |
          npx playwright test \
            --reporter=html,line,json \
            --output=test-results
        env:
          CI: true
          # Enable coverage if your tests support it (Playwright + istanbul/c8 style)
          # PLAYWRIGHT_COVERAGE: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # =========================================================
  # Job 3: Summary – posts combined status comment
  # =========================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [bunit, playwright]
    if: always()

    steps:
      - name: Checkout (for comment context)
        uses: actions/checkout@v4

      - name: Create combined status comment
        uses: actions/github-script@v7
        with:
          script: |
            const bunitJobs = ${{ toJSON(needs.bunit) }};
            const playwright = ${{ toJSON(needs.playwright) }};

            const bunitSuccess = bunitJobs.result === 'success';
            const playwrightSuccess = playwright.result === 'success';

            const overall = bunitSuccess && playwrightSuccess ? '✅ All checks passed' : '❌ Some checks failed';

            const body = `### CI Summary

            | Job | Status |
            |-----|--------|
            | **bUnit** (.NET 8 / 9 / 10) | ${bunitSuccess ? '✅ Passed' : '❌ Failed'} |
            | **Playwright** | ${playwrightSuccess ? '✅ Passed' : '❌ Failed'} |

            **Overall:** ${overall}
            `;

            // Only post on pull requests
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              console.log(body);
            }