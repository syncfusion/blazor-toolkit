# Authoritative publication path for this repository: GitHub Packages + GitHub Release assets.
# See .github/DEVELOPMENT.md "Release, signing and publication" for the policy this file implements.
name: Publish to GitHub Packages (Signed)

on:
  release:
    types: [published]

permissions:
  contents: write          # upload release assets
  packages: write          # push to GitHub Packages
  id-token: write          # SLSA provenance
  attestations: write      # SLSA provenance
  security-events: write

concurrency:
  group: nuget-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES_DIR: ${{ github.workspace }}/nupkgs
  SBOM_DIR: ${{ github.workspace }}/sbom

jobs:
  publish:
    name: Scan → Pack → Check → Sign → SBOM → Attest → Publish
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # -------------------------------------------------
      # 1. Checkout (full history for SourceLink)
      # -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # 2. Setup .NET
      # -------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # -------------------------------------------------
      # 3. Restore
      # -------------------------------------------------
      - name: Restore
        run: dotnet restore ./src/Syncfusion.Blazor.Toolkit.slnx

      # -------------------------------------------------
      # 4. Vulnerability scan (fail on High / Critical)
      # -------------------------------------------------
      - name: Vulnerability scan
        run: |
          bash .github/scripts/check-vulnerabilities.sh \
            --project ./src/Syncfusion.Blazor.Toolkit.csproj \
            --min-severity High \
            --report vuln-report.md

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report
          path: vuln-report.md
          if-no-files-found: ignore
          retention-days: 90

      # -------------------------------------------------
      # 5. Pack (deterministic + SourceLink)
      #    CycloneDX is automatically embedded by Directory.Build.targets
      # -------------------------------------------------
      - name: Pack
        run: |
          mkdir -p "${{ env.NUGET_PACKAGES_DIR }}" "${{ env.SBOM_DIR }}"
          dotnet pack ./src/Syncfusion.Blazor.Toolkit.csproj \
            -c Release \
            -p:ContinuousIntegrationBuild=true \
            -p:EmbedUntrackedSources=true \
            -o "${{ env.NUGET_PACKAGES_DIR }}"

      # -------------------------------------------------
      # 6. Skill documentation must match the packed public API (AI-03)
      # -------------------------------------------------
      - name: Check AI skill documentation against packed API
        run: |
          set -euo pipefail
          pkg="$(ls "${{ env.NUGET_PACKAGES_DIR }}"/*.nupkg | head -n 1)"
          python3 .github/scripts/check-skill-api.py --xml "$pkg" \
            --skills .github/skills/syncfusion-blazor-toolkit-popups .github/skills/syncfusion-blazor-toolkit-calendars
          python3 .github/scripts/check-skill-api.py --xml "$pkg" --warn-only

      # -------------------------------------------------
      # 7. CycloneDX SBOM (Directory.Build.targets skips embedding when CI=true)
      # -------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          dotnet tool update --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"

          mkdir -p "${{ env.SBOM_DIR }}"

          dotnet-CycloneDX ./src/Syncfusion.Blazor.Toolkit.csproj \
            --output "${{ env.SBOM_DIR }}" \
            --filename Syncfusion.Blazor.Toolkit.cdx.json \
            --output-format Json

          test -s "${{ env.SBOM_DIR }}/Syncfusion.Blazor.Toolkit.cdx.json"
          ls -la "${{ env.SBOM_DIR }}"

      # -------------------------------------------------
      # 8. Signing is REQUIRED – fail if secrets are missing
      # -------------------------------------------------
      - name: Verify signing secrets exist
        run: |
          if [ -z "${{ secrets.NUGET_SIGNING_CERT_BASE64 }}" ] || [ -z "${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}" ]; then
            echo "::error::Signing secrets missing. Set NUGET_SIGNING_CERT_BASE64 and NUGET_SIGNING_CERT_PASSWORD."
            exit 1
          fi

      - name: Sign NuGet package
        env:
          CERT_BASE64: ${{ secrets.NUGET_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_BASE64" | base64 -d > signing-cert.pfx

          for pkg in "${{ env.NUGET_PACKAGES_DIR }}"/*.nupkg; do
            echo "Signing $pkg ..."
            dotnet nuget sign "$pkg" \
              --certificate-path signing-cert.pfx \
              --certificate-password "$CERT_PASSWORD" \
              --timestamper http://timestamp.digicert.com \
              --overwrite
          done

          # Destroy the certificate immediately
          shred -u signing-cert.pfx 2>/dev/null || rm -f signing-cert.pfx

      # -------------------------------------------------
      # 9. Verify the package is signed
      # -------------------------------------------------
      - name: Verify package signature
        run: |
          set -euo pipefail
          for pkg in "${{ env.NUGET_PACKAGES_DIR }}"/*.nupkg; do
            echo "Verifying signature of $pkg ..."
            dotnet nuget verify "$pkg" --all
          done
          echo "All packages are correctly signed."

      # -------------------------------------------------
      # 9b. SPDX SBOM bound to the FINAL, SIGNED packages (PI-06 / PI-07)
      # -------------------------------------------------
      - name: Generate SPDX SBOM from signed packages
        run: |
          set -euo pipefail

          dotnet tool update --global Microsoft.Sbom.DotNetTool
          export PATH="$PATH:$HOME/.dotnet/tools"

          spdx_work="${RUNNER_TEMP}/spdx"
          rm -rf "$spdx_work"

          sbom-tool generate \
            -b "${{ env.NUGET_PACKAGES_DIR }}" \
            -bc ./src \
            -m "$spdx_work" \
            -pn "Syncfusion.Blazor.Toolkit" \
            -pv "${{ github.event.release.tag_name }}" \
            -ps "Syncfusion Inc." \
            -nsb "https://github.com/syncfusion/blazor-toolkit" \
            -V Verbose

          src="$(find "$spdx_work" -name 'manifest.spdx.json' | head -n 1)"
          test -s "$src"

          cp "$src" "${{ env.SBOM_DIR }}/Syncfusion.Blazor.Toolkit-${{ github.event.release.tag_name }}.spdx.json"

      - name: Verify SPDX digests match the signed packages
        run: |
          set -euo pipefail

          spdx="$(ls "${{ env.SBOM_DIR }}"/*.spdx.json | head -n 1)"

          for pkg in "${{ env.NUGET_PACKAGES_DIR }}"/*.nupkg; do
            name="$(basename "$pkg")"

            actual="$(sha256sum "$pkg" | cut -d' ' -f1)"

            recorded="$(jq -r --arg n "$name" \
              '[.files[] | select(.fileName | endswith($n)) | .checksums[] | select(.algorithm=="SHA256") | .checksumValue] | first // empty' \
              "$spdx")"

            if [ "$actual" != "$recorded" ]; then
              echo "::error::SPDX digest for $name ($recorded) does not match the signed package ($actual)"
              exit 1
            fi

            echo "SPDX digest matches signed package: $name $actual"
          done

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail

          cd "${{ github.workspace }}"

          sha256sum \
            nupkgs/*.nupkg \
            sbom/*.cdx.json \
            sbom/*.spdx.json \
            > "${{ env.SBOM_DIR }}/SHA256SUMS"

          cat "${{ env.SBOM_DIR }}/SHA256SUMS"

      # -------------------------------------------------
      # 10. SLSA Build Provenance attestation
      # -------------------------------------------------
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.NUGET_PACKAGES_DIR }}/*.nupkg

      # -------------------------------------------------
      # 11. Publish signed package to GitHub Packages (authoritative registry)
      # -------------------------------------------------
      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "${{ env.NUGET_PACKAGES_DIR }}/*.nupkg" \
            --source "github" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      # -------------------------------------------------
      # 12. Upload signed package + both SBOMs to the Release
      # -------------------------------------------------
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.NUGET_PACKAGES_DIR }}/*.nupkg
            ${{ env.SBOM_DIR }}/*.cdx.json
            ${{ env.SBOM_DIR }}/*.spdx.json
            ${{ env.SBOM_DIR }}/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
